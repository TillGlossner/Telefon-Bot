[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telefonbot"
version = "0.1.0"
description = "Lokal gehosteter Telefon-Sprachbot mit Entscheidungsbaum-Dialogen (ASR/TTS on-premise)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Der Kern laeuft absichtlich ohne Fremdabhaengigkeiten (Standardbibliothek + PyYAML),
# damit er auf einer LMU-VM ohne Internetzugang installierbar und testbar bleibt.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1", "numpy>=1.26"]
tts = ["piper-tts>=1.2", "numpy>=1.26"]
vad = ["onnxruntime>=1.17", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
all = ["telefonbot[asr,tts,vad,dev]"]

[project.scripts]
telefonbot = "telefonbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["telefonbot"]
ignore_missing_imports = true
