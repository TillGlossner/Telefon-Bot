# Beispielbaum: Telefonannahme eines Lehrstuhl-Sekretariats.
#
# Gedacht als Vorlage, nicht als fertiger Produktivbaum -- Ansagen, Nebenstellen
# und Oeffnungszeiten muessen an den eigenen Lehrstuhl angepasst werden.
#
# Grundsaetze, die in diesem Baum stecken:
#   1. Der Anrufer erfaehrt im ersten Satz, dass er mit einem Automaten spricht.
#   2. "Mitarbeiter" oder die Null fuehren jederzeit zu einem Menschen.
#   3. Nach zwei Missverstaendnissen wird weitergeleitet statt weitergefragt.
id: lehrstuhl_sekretariat
version: 1
locale: de-DE
description: Anliegen aufnehmen, Termine notieren, sonst an das Sekretariat weiterleiten
start: begruessung

settings:
  max_attempts: 2
  timeout_s: 6
  barge_in: true
  min_confidence: 0.45
  escalation_node: weiterleitung_pruefen

slots:
  anliegen: { type: choice, description: Hauptanliegen des Anrufs }
  datum: { type: date, description: Wunschtag fuer den Termin }
  uhrzeit: { type: time, description: Wunschzeit fuer den Termin }
  name: { type: text, description: Name des Anrufers, sensitive: true }
  rueckrufnummer: { type: digits, description: Rufnummer fuer den Rueckruf, sensitive: true }
  matrikelnummer: { type: digits, description: Matrikelnummer, sensitive: true }
  pruefungsanliegen: { type: choice, description: Art des Pruefungsanliegens }
  dringend: { type: yes_no, description: Rueckruf noch heute noetig }
  vorgangsnummer: { type: text, description: Nummer des angelegten Vorgangs }

global_commands:
  - name: mensch
    phrases: ["mitarbeiter", "mitarbeiterin", "mensch", "echten menschen", "sekretariat", "jemanden sprechen"]
    action: goto
    target: weiterleitung_pruefen
    dtmf: "0"
  - name: wiederholen
    phrases: ["wiederholen", "nochmal", "noch mal", "wie bitte", "nicht verstanden"]
    action: repeat
  - name: oeffnungszeiten
    phrases: ["öffnungszeiten", "sprechzeiten", "wann habt ihr auf", "wann ist geoeffnet"]
    action: goto
    target: oeffnungszeiten
  - name: abbrechen
    phrases: ["abbrechen", "auflegen", "hat sich erledigt", "danke das wars"]
    action: goto
    target: verabschiedung

nodes:
  begruessung:
    type: say
    text: >
      Guten Tag, hier ist der automatische Telefondienst des Lehrstuhls.
      Ich bin ein Sprachassistent und nehme Ihr Anliegen auf.
      Sagen Sie jederzeit Mitarbeiter oder drücken Sie die Null,
      um mit einer Person verbunden zu werden.
    next: sprechzeit_pruefen

  # Ausserhalb der Sprechzeit ist niemand da, zu dem weitergeleitet werden
  # koennte. Der Baum sagt das offen und nimmt das Anliegen trotzdem auf.
  sprechzeit_pruefen:
    type: branch
    cases:
      - when: [{ slot: innerhalb_sprechzeit, op: eq, value: "nein" }]
        next: hinweis_geschlossen
    next: hauptmenue

  hinweis_geschlossen:
    type: say
    text: >
      Das Sekretariat ist im Moment nicht besetzt, wieder erreichbar
      {naechste_sprechzeit}. Ich nehme Ihr Anliegen trotzdem auf.
    next: hauptmenue

  hauptmenue:
    type: ask
    text: >
      Möchten Sie einen Termin vereinbaren, einen Rückruf erbitten
      oder geht es um eine Prüfungsangelegenheit?
    reprompt: >
      Bitte sagen Sie Termin, Rückruf oder Prüfung.
      Sie können auch die Eins, Zwei oder Drei drücken.
    no_input_text: >
      Ich habe Sie nicht gehört. Sagen Sie Termin, Rückruf oder Prüfung.
    slot: anliegen
    expect:
      type: choice
      options:
        termin: ["termin", "termine", "sprechstunde", "beratung", "besprechung", "treffen"]
        rueckruf: ["rückruf", "zurückrufen", "anrufen", "rueckmeldung"]
        pruefung: ["prüfung", "prüfungsamt", "klausur", "note", "noten", "prüfungsangelegenheit"]
      dtmf:
        "1": termin
        "2": rueckruf
        "3": pruefung
    transitions:
      termin: termin_datum
      rueckruf: rueckruf_name
      pruefung: pruefung_art

  # --------------------------------------------------------------- Termin

  termin_datum:
    type: ask
    text: An welchem Tag möchten Sie kommen?
    reprompt: Bitte nennen Sie einen Tag, zum Beispiel morgen oder Dienstag, den vierzehnten.
    slot: datum
    expect: date
    next: termin_uhrzeit

  termin_uhrzeit:
    type: ask
    text: Um welche Uhrzeit passt es Ihnen?
    reprompt: Bitte nennen Sie eine Uhrzeit, zum Beispiel vierzehn Uhr dreißig.
    slot: uhrzeit
    expect: time
    next: termin_name

  termin_name:
    type: ask
    text: Und wie ist Ihr Name?
    reprompt: Bitte nennen Sie Ihren Vor- und Nachnamen.
    slot: name
    expect: text
    next: termin_bestaetigen

  termin_bestaetigen:
    type: confirm
    text: "Ich habe notiert: {name}, am {datum} um {uhrzeit} Uhr. Stimmt das so?"
    reprompt: Bitte antworten Sie mit ja oder nein.
    on_yes: termin_anlegen
    on_no: termin_datum

  termin_anlegen:
    type: action
    action: create_appointment
    args:
      art: termin
      datum: "{datum}"
      uhrzeit: "{uhrzeit}"
      name: "{name}"
    assign: vorgangsnummer
    next: termin_ende
    on_error: weiterleitung_pruefen

  termin_ende:
    type: hangup
    text: >
      Ihr Terminwunsch ist unter der Nummer {vorgangsnummer} vermerkt.
      Das Sekretariat bestätigt Ihnen den Termin.
      Vielen Dank für Ihren Anruf und auf Wiederhören.
    reason: completed

  # -------------------------------------------------------------- Rueckruf

  rueckruf_name:
    type: ask
    text: Gerne notiere ich einen Rückruf. Wie ist Ihr Name?
    reprompt: Bitte nennen Sie Ihren Vor- und Nachnamen.
    slot: name
    expect: text
    next: rueckruf_nummer

  rueckruf_nummer:
    type: ask
    text: >
      Unter welcher Rufnummer sind Sie erreichbar?
      Sie können die Nummer auch über die Tastatur eingeben
      und mit der Raute abschliessen.
    reprompt: Bitte nennen Sie Ihre Rufnummer Ziffer für Ziffer.
    slot: rueckrufnummer
    expect: digits
    next: rueckruf_dringend

  rueckruf_dringend:
    type: confirm
    text: Ist Ihr Anliegen dringend, also noch heute?
    slot: dringend
    on_yes: weiterleitung_pruefen
    on_no: rueckruf_anlegen

  rueckruf_anlegen:
    type: action
    action: create_ticket
    args:
      art: rueckruf
      name: "{name}"
      nummer: "{rueckrufnummer}"
    assign: vorgangsnummer
    next: rueckruf_ende
    on_error: weiterleitung_pruefen

  rueckruf_ende:
    type: hangup
    text: >
      Danke. Der Rückruf ist unter der Nummer {vorgangsnummer} notiert,
      das Sekretariat meldet sich bei Ihnen. Auf Wiederhören.
    reason: completed

  # -------------------------------------------------------------- Pruefung

  pruefung_art:
    type: ask
    text: >
      Geht es um eine Prüfungsanmeldung, um ein Attest
      oder um eine Notenbescheinigung?
    reprompt: Bitte sagen Sie Anmeldung, Attest oder Bescheinigung.
    slot: pruefungsanliegen
    expect:
      type: choice
      options:
        anmeldung: ["anmeldung", "anmelden", "prüfungsanmeldung", "eintragen"]
        attest: ["attest", "krank", "krankmeldung", "krankschreibung", "rücktritt"]
        bescheinigung: ["bescheinigung", "notenbescheinigung", "zeugnis", "noten", "schein"]
      dtmf:
        "1": anmeldung
        "2": attest
        "3": bescheinigung
    transitions:
      anmeldung: pruefung_matrikel
      attest: pruefung_attest_hinweis
      bescheinigung: pruefung_matrikel

  pruefung_attest_hinweis:
    type: say
    text: >
      Ein Attest muss im Original im Prüfungsamt eingehen.
      Ich nehme Ihre Daten auf und leite den Vorgang weiter.
    next: pruefung_matrikel

  pruefung_matrikel:
    type: ask
    text: Bitte nennen Sie Ihre achtstellige Matrikelnummer.
    reprompt: >
      Bitte nennen Sie die acht Ziffern Ihrer Matrikelnummer
      oder geben Sie sie über die Tastatur ein.
    slot: matrikelnummer
    expect:
      type: digits
      length: 8
    next: pruefung_name

  pruefung_name:
    type: ask
    text: Und wie ist Ihr Name?
    slot: name
    expect: text
    next: pruefung_anlegen

  pruefung_anlegen:
    type: action
    action: create_ticket
    args:
      art: pruefung
      unterart: "{pruefungsanliegen}"
      matrikelnummer: "{matrikelnummer}"
      name: "{name}"
    assign: vorgangsnummer
    next: pruefung_ende
    on_error: weiterleitung_pruefen

  pruefung_ende:
    type: hangup
    text: >
      Ihr Anliegen ist unter der Nummer {vorgangsnummer} aufgenommen.
      Das Prüfungssekretariat bearbeitet es und meldet sich bei Rückfragen.
      Auf Wiederhören.
    reason: completed

  # ------------------------------------------------------------- Allgemein

  oeffnungszeiten:
    type: say
    text: >
      Das Sekretariat ist montags bis donnerstags von neun bis zwölf Uhr
      und von vierzehn bis sechzehn Uhr besetzt, freitags von neun bis zwölf Uhr.
    next: hauptmenue

  weiterleitung_pruefen:
    type: branch
    cases:
      - when: [{ slot: innerhalb_sprechzeit, op: eq, value: "nein" }]
        next: weiterleitung_nicht_moeglich
    next: weiterleitung

  weiterleitung:
    type: transfer
    text: Einen Moment bitte, ich verbinde Sie mit dem Sekretariat.
    # Nebenstelle der zentralen Anlage -- Ziel im Dialplan hinterlegt.
    target: "PJSIP/sekretariat@uni-pbx"

  weiterleitung_nicht_moeglich:
    type: say
    text: >
      Das Sekretariat ist gerade nicht besetzt, wieder erreichbar
      {naechste_sprechzeit}. Ich notiere Ihnen einen Rückruf.
    next: rueckruf_name

  verabschiedung:
    type: hangup
    text: Vielen Dank für Ihren Anruf. Auf Wiederhören.
    reason: caller_cancelled
