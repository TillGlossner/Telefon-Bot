; Beispiel-Dialplan fuer den Telefonbot.
; Getestet gegen die AudioSocket-Anwendung von Asterisk 18+.
;
; Ablauf:
;   1. Anruf annehmen, eindeutige UUID erzeugen
;   2. Gespraech ueber AudioSocket an den Bot geben (Port 8090)
;   3. Nach Gespraechsende beim Bot nachfragen, ob weitergeleitet werden soll
;
; Schritt 3 ist noetig, weil der Bot ueber AudioSocket selbst nicht
; weiterverbinden kann: er hinterlegt das Ziel in seiner Control-API.

[globals]
BOT_HOST=127.0.0.1
BOT_PORT=8090
BOT_CONTROL=http://127.0.0.1:8091
; Durchwahl des Sekretariats an der zentralen Anlage. Der Bot liefert als
; Weiterleitungsziel "PJSIP/sekretariat@uni-pbx"; die Zeile unten setzt den
; Platzhalter auf die echte Durchwahl um.
SEKRETARIAT=PJSIP/67890@uni-pbx

[telefonbot]
exten => _X.,1,NoOp(Telefonbot uebernimmt Anruf von ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(BOTUUID=${UUID()})
 same => n,Set(CHANNEL(hangup_handler_push)=telefonbot-ende,s,1)
 ; Optional: DTMF im Dialplan mitschneiden, falls die Asterisk-Version
 ; keine DTMF-Rahmen ueber AudioSocket weiterreicht (siehe docs/04).
 same => n,AudioSocket(${BOTUUID},${BOT_HOST}:${BOT_PORT})
 same => n,Goto(telefonbot-weiter,s,1)

[telefonbot-weiter]
; Nach dem Bot: Weiterleitungsziel aus der Control-API holen.
exten => s,1,NoOp(Bot beendet, pruefe Weiterleitung)
 same => n,Set(ZIEL=${CURL(${BOT_CONTROL}/calls/${BOTUUID}/transfer)})
 same => n,GotoIf($["${ZIEL}" = ""]?ende)
 ; Platzhalter des Baums auf die echte Durchwahl umsetzen
 same => n,Set(ZIEL=${IF($["${ZIEL}" = "PJSIP/sekretariat@uni-pbx"]?${SEKRETARIAT}:${ZIEL})})
 same => n,NoOp(Weiterleitung an ${ZIEL})
 ; Als Nebenstelle geht die Weiterleitung als neuer Anruf ueber die zentrale
 ; Anlage. Wo SIP-REFER erlaubt ist, spart Transfer(${ZIEL}) einen Kanal.
 same => n,Dial(${ZIEL},30,m)
 same => n,NoOp(Weiterleitung nicht erfolgreich: ${DIALSTATUS})
 same => n(ende),Hangup()

[telefonbot-ende]
; Aufraeumen, falls der Anrufer waehrend des Bots auflegt.
exten => s,1,NoOp(Anruf ${BOTUUID} beendet: ${HANGUPCAUSE})
 same => n,Return()

; Einbindung in den bestehenden Plan, z.B.:
; [von-nebenstellen]
; exten => 12345,1,Goto(telefonbot,${EXTEN},1)
